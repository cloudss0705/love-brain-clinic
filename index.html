function quickChips(){const a=lang==='en'?['How was your day?','I like talking to you','You seem a little quiet today','Tell me something you have not told me','That sounds like a date','No pressure — reply when free','Wait, are you flirting with me?','I am curious where this is going','Want to grab food this week?','I am going to be honest…']:lang==='zh-CN'?['今天过得怎么样？','我挺喜欢和你聊天的','你今天好像有点安静','告诉我一件你没说过的事','这听起来像是在约会','不急，有空再回我','等一下，你是在撩我吗？','我有点好奇我们会走到哪','这周要不要一起吃饭？','我想诚实说一句…']:['今日過得點？','我幾鍾意同你傾偈','你今日好似靜咗啲','講件你未同我講過嘅事','呢句聽落似係約會喎','唔急，有空先覆我','等陣，你係咪撩緊我？','我有少少好奇我哋會行到邊','今個星期一齊食飯？','我想老實講一句…'];return a.map(x=>`<button data-quick="${esc(x)}">${esc(x)}</button>`).join('')}
function chatHTML(){const msgs=chat.length?chat.map(m=>`<div class="msg ${m.me?'me':'them'}">${esc(m.text)}</div>`).join(''):`<div class="msg them">${t('hello')}</div>`;return `<div class="head"><div><div class="eyebrow">mode 03 / live texting</div><h2>${t('mode3Title')}</h2><p>${t('mode3Sub')}</p></div><span class="pill" style="color:var(--ink);background:var(--green);border:0">${CONFIG.character.name[lang]} online</span></div><div class="arena"><div class="chat-arena"><div class="arena-top"><b>${CONFIG.character.emoji} ${CONFIG.character.name[lang]}</b><span class="online">● ${lang==='en'?'online now':lang==='zh-CN'?'正在在线':'而家 online'}</span></div><div class="chat-log" id="chatLog">${msgs}</div><div class="quick">${quickChips()}</div><form class="arena-input" id="chatForm"><input id="chatText" placeholder="${t('placeholder')}"><button class="send">${t('send')}</button></form></div><div class="profile-card"><div class="eyebrow">VIBE CHECK</div><h3>${lang==='en'?'No right way to flirt.':lang==='zh-CN'?'没有唯一的暧昧方式。':'曖昧冇唯一正確玩法。'}</h3><p>${t('empty')}</p><p class="privacy-note">🔒 ${lang==='en'?'Your messages stay in this browser. Results are for entertainment and discussion, not professional advice.':lang==='zh-CN'?'你的聊天内容只保留在本浏览器中。结果仅供娱乐和讨论，不构成专业建议。':'你嘅對話只會留喺呢個瀏覽器。結果只供娛樂同討論，唔係專業建議。'}</p><div class="mini-stat"><span>${t('tension')}</span><b>${Math.min(100,35+stats.tension)}%</b></div><div class="mini-stat"><span>${t('over')}</span><b>${Math.min(100,stats.over)}%</b></div><div class="actions"><button class="primary" id="finishChat">${t('finish')}</button><button class="secondary" id="resetChat">${t('reset')}</button></div></div></div>`}
function sendChat(text){if(!text.trim())return;chat.push({me:true,text:text.trim()});const low=text.toLowerCase();let reply=lang==='en'?'That is a surprisingly honest answer.':lang==='zh-CN'?'这个回答意外地诚实。':'呢個答案意外地誠實。';if(text.includes('?')||text.includes('？'))reply=lang==='en'?'You ask good questions. I kind of want to answer that properly.':lang==='zh-CN'?'你很会问问题。我好像想认真回答。':'你幾識問問題喎，我好似想認真答你。';else if(/笑|哈哈|haha|😂/.test(low))reply=lang==='en'?'You are laughing, but I am not sure if you are joking.':lang==='zh-CN'?'你在笑，但我不确定你是不是认真的。':'你笑緊，但我唔知你係咪認真喎。';else if(text.length>18)reply=lang==='en'?'I like that you actually said what you meant.':lang==='zh-CN'?'我喜欢你真的把想法说出来。':'我鍾意你真係講咗你想講嘅嘢。';chat.push({me:false,text:reply});stats.score+=text.length>18?10:6;stats.over+=text.length>25?12:4;stats.clear+=text.includes('?')||text.includes('？')?8:3;stats.tension+=10;render()}
function makeDiagnosis(){const max=mode==='rapid'?CONFIG.rapidQuestions.length*16:CONFIG.scenarios.length*20;const score=Math.max(0,Math.min(100,Math.round(stats.score/max*100)));const band=score>67?'high':score<37?'low':'mid';const idx=Math.min(19,Math.max(0,Math.round((score*.19)+(stats.over*.02)-(stats.clear*.015))));const hash=CONFIG.hashtags[band][Math.floor(Math.random()*CONFIG.hashtags[band].length)];const phrase=CONFIG.catchphrases[band][Math.floor(Math.random()*CONFIG.catchphrases[band].length)];return{score,band,hash,phrase,type:CONFIG.archetypes[idx]}}
function resultHTML(){const r=diagnosis;return `<div class="head"><div><div class="eyebrow">result / screenshot this</div><h2>${t('report')}</h2><p>${lang==='en'?'A snapshot, not a verdict. Keep what feels true.':lang==='zh-CN'?'这是一个切面，不是判决。留下有共鸣的部分。':'呢個係一個切面，唔係判決。留低有共鳴嗰啲就夠。'}</p></div></div><div class="result-grid"><div class="poster"><div class="eyebrow" style="color:#ffb6cf">${t('score')}</div><div class="score">${r.score}<span style="font-size:34px">%</span></div><div class="hashtag">${r.hash}</div><h3>${r.type[0]} · ${r.type[1]}</h3><p>“${r.phrase}”</p></div><div class="result-side"><div class="metric"><h4>${t('over')}　${Math.min(100,stats.over)}%</h4><div class="meter"><i style="width:${Math.min(100,stats.over)}%"></i></div><p>${stats.over>60?(lang==='en'?'Your brain is writing bonus scenes.':'你個腦寫緊加長版。'):(lang==='en'?'You leave room for reality.':'你識得留返空白位畀現實。')}</p></div><div class="metric"><h4>${t('clear')}　${Math.min(100,stats.clear)}%</h4><div class="meter"><i style="width:${Math.min(100,stats.clear)}%;background:linear-gradient(90deg,#7667f4,#a59cff)"></i></div><p>${lang==='en'?'A heart with boundaries.':'有心動，亦有界線。'}</p></div><div class="metric"><h4>${t('tension')}　${Math.min(100,stats.tension)}%</h4><div class="meter"><i style="width:${Math.min(100,stats.tension)}%;background:linear-gradient(90deg,#ff8666,#ff6598)"></i></div><p>${lang==='en'?'The part that makes the chat worth opening.':'令你忍唔住開返個 chat 嗰一部分。'}</p></div><div class="actions"><button class="primary" id="copyResult">${t('copy')}</button><button class="secondary" id="again">${t('reset')}</button></div></div></div>`}
function reset(){si=ri=0;chat=[];stats={score:0,over:0,clear:0,tension:0};diagnosis=null;render()}
function bind(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>addScenario(CONFIG.scenarios[si].opts[+b.dataset.choice]));document.querySelectorAll('[data-rapid]').forEach(b=>b.onclick=()=>pickRapid(+b.dataset.rapid));$('#customForm')?.addEventListener('submit',e=>{e.preventDefault();const x=$('#customInput').value;if(x.trim()){stats.score+=Math.min(18,x.length);stats.over+=x.length>22?12:4;stats.clear+=x.includes('?')||x.includes('？')?8:2;stats.tension+=9;si++;if(si>=CONFIG.scenarios.length)diagnosis=makeDiagnosis();render()}});$('#chatForm')?.addEventListener('submit',e=>{e.preventDefault();sendChat($('#chatText').value)});document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>sendChat(b.dataset.quick));$('#finishChat')?.addEventListener('click',()=>{diagnosis=makeDiagnosis();render()});$('#resetChat')?.addEventListener('click',reset);$('#copyResult')?.addEventListener('click',()=>{navigator.clipboard?.writeText(`${diagnosis.hash} ${diagnosis.type[1]} · ${diagnosis.score}% · ${diagnosis.phrase}`);toast(t('copied'))});$('#again')?.addEventListener('click',reset)}
function toast(x){const e=$('#toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1900)}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;diagnosis=null;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x===b));reset()});render();
</script>
</body></html>
